<!DOCTYPE html>
<html>
<head>
    <title>IFRS 16 Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 40px; background-color: #f4f4f9; }
        .container { background: white; padding: 20px; border-radius: 8px; max-width: 600px; margin: auto; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        input { margin: 10px 0; padding: 8px; width: 100%; box-sizing: border-box; }
        button { background-color: #007bff; color: white; padding: 10px; border: none; cursor: pointer; width: 100%; font-size: 16px; margin-bottom: 20px; }
        button:hover { background-color: #0056b3; }
        h2 { color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #007bff; color: white; }
        .result-box { background-color: #e9ecef; padding: 15px; border-radius: 5px; font-size: 18px; font-weight: bold; color: #28a745; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>IFRS 16 Lease Liability Calculator</h1>
        
        <label>Lease Name:</label>
        <input type="text" id="name" value="Office Lease 2026">
        
        <label>Annual Lease Payment ($):</label>
        <input type="number" id="payment" value="10000">
        
        <label>Lease Term (Years):</label>
        <input type="number" id="years" value="5">
        
        <label>Discount Rate (Decimal, e.g., 0.05 for 5%):</label>
        <input type="number" step="0.01" id="rate" value="0.05">
        
        <button onclick="calculate()">Calculate & Save Liability</button>
        
        <div class="result-box" id="result">Liability: $0.00</div>

        <h2>Saved Leases</h2>
        <table id="leaseTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Annual Payment</th>
                    <th>Years</th>
                    <th>Liability</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        async function calculate() {
            const name = document.getElementById('name').value;
            const payment = document.getElementById('payment').value;
            const years = document.getElementById('years').value;
            const rate = document.getElementById('rate').value;
            
            const response = await fetch(`/calculate-ifrs16?name=${name}&lease_payment=${payment}&years=${years}&discount_rate=${rate}`);
            const data = await response.json();
            
            document.getElementById('result').innerText = `Liability: $${data.lease_liability.toLocaleString()}`;
            loadLeases(); // Refresh the table
        }

        async function loadLeases() {
            const response = await fetch('/leases');
            const leases = await response.json();
            const tbody = document.querySelector('#leaseTable tbody');
            tbody.innerHTML = ''; // Clear existing rows

            leases.forEach(lease => {
                const row = `<tr>
                    <td>${lease.id}</td>
                    <td>${lease.name}</td>
                    <td>$${lease.annual_payment.toLocaleString()}</td>
                    <td>${lease.years}</td>
                    <td>$${lease.liability.toLocaleString()}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        // Load leases when the page first opens
        window.onload = loadLeases;
    </script>
</body>
</html>
